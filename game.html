<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Survival | GameSAA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#05050b;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
  user-select:none;
}
canvas{
  display:block;
  background:
    radial-gradient(circle,#10152d,#05050b 70%);
}
#ui{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}
.stat{
  background:#090917dd;
  border:1px solid #654cff;
  box-shadow:0 0 15px #3920a8;
  padding:10px 16px;
  border-radius:12px;
  font-weight:bold;
}
#startScreen,#gameOver{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#03030bee;
  z-index:10;
}
.panel{
  width:min(90%,500px);
  padding:40px;
  border:1px solid #704cff;
  border-radius:25px;
  background:#0b0b18;
  box-shadow:0 0 50px #381b9b;
}
h1{
  font-size:55px;
  color:#a66cff;
  text-shadow:0 0 20px #704cff;
  margin-bottom:15px;
}
p{
  color:#aaaabe;
  line-height:1.7;
  margin-bottom:25px;
}
button{
  border:0;
  border-radius:30px;
  padding:14px 35px;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#713cff,#168cff);
  box-shadow:0 0 25px #5030ff;
}
button:hover{
  transform:scale(1.05);
}
.hidden{display:none!important}
#touch{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:none;
  justify-content:center;
  pointer-events:none;
  z-index:6;
}
#touch button{
  pointer-events:auto;
  width:80px;
  height:80px;
  padding:0;
  opacity:.7;
}
@media(max-width:700px){
  #touch{display:flex}
  h1{font-size:40px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="stat">❤️ <span id="hp">3</span></div>
  <div class="stat">🏆 <span id="score">0</span></div>
  <div class="stat">⚡ Level <span id="level">1</span></div>
</div>

<div id="startScreen">
  <div class="panel">
    <h1>NEON SURVIVAL</h1>
    <p>
      Survive as long as possible.<br>
      Move with <b>WASD</b> or arrow keys.<br>
      Aim with your mouse and click to shoot.
    </p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<div id="gameOver" class="hidden">
  <div class="panel">
    <h1>GAME OVER</h1>
    <p>Your score: <b id="finalScore">0</b></p>
    <p>Best score: <b id="bestScore">0</b></p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<div id="touch">
  <button id="shootBtn">🔫</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let mouse={x:W/2,y:H/2,down:false};

canvas.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});
canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

const player={
  x:0,y:0,r:18,
  speed:4,
  hp:3
};

let bullets=[];
let enemies=[];
let particles=[];
let score=0;
let level=1;
let running=false;
let lastShot=0;
let spawnTimer=0;
let difficultyTimer=0;

function reset(){
  player.x=W/2;
  player.y=H/2;
  player.hp=3;
  bullets=[];
  enemies=[];
  particles=[];
  score=0;
  level=1;
  spawnTimer=0;
  difficultyTimer=0;
}

function shoot(){
  const now=performance.now();
  if(now-lastShot<180)return;

  lastShot=now;

  const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);

  bullets.push({
    x:player.x,
    y:player.y,
    vx:Math.cos(a)*9,
    vy:Math.sin(a)*9,
    r:5
  });

  for(let i=0;i<5;i++){
    particles.push({
      x:player.x+Math.cos(a)*20,
      y:player.y+Math.sin(a)*20,
      vx:(Math.random()-.5)*3,
      vy:(Math.random()-.5)*3,
      life:20
    });
  }
}

function spawnEnemy(){
  let side=Math.floor(Math.random()*4);
  let x,y;

  if(side===0){x=Math.random()*W;y=-30}
  if(side===1){x=W+30;y=Math.random()*H}
  if(side===2){x=Math.random()*W;y=H+30}
  if(side===3){x=-30;y=Math.random()*H}

  const fast=Math.random()<.2;

  enemies.push({
    x,y,
    r:14+Math.random()*8,
    speed:(fast?1.8:1.1)+level*.08,
    hp:fast?2:1,
    color:fast?"#20d9ff":"#b84cff"
  });
}

function explosion(x,y){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*4+1;

    particles.push({
      x,y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:35
    });
  }
}

function update(){
  if(!running)return;

  let dx=0,dy=0;

  if(keys["w"]||keys["arrowup"])dy--;
  if(keys["s"]||keys["arrowdown"])dy++;
  if(keys["a"]||keys["arrowleft"])dx--;
  if(keys["d"]||keys["arrowright"])dx++;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    player.x+=dx/len*player.speed;
    player.y+=dy/len*player.speed;
  }

  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  if(mouse.down)shoot();

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;
    b.y+=b.vy;

    if(b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){
      bullets.splice(i,1);
      continue;
    }

    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const d=Math.hypot(b.x-e.x,b.y-e.y);

      if(d<b.r+e.r){
        e.hp--;
        bullets.splice(i,1);

        if(e.hp<=0){
          score+=10;
          explosion(e.x,e.y);
          enemies.splice(j,1);

          if(score%100===0)level++;
        }
        break;
      }
    }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const a=Math.atan2(player.y-e.y,player.x-e.x);

    e.x+=Math.cos(a)*e.speed;
    e.y+=Math.sin(a)*e.speed;

    if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){
      player.hp--;
      explosion(e.x,e.y);
      enemies.splice(i,1);

      if(player.hp<=0){
        endGame();
      }
    }
  }

  spawnTimer++;
  difficultyTimer++;

  const spawnRate=Math.max(18,70-level*4);

  if(spawnTimer>spawnRate){
    spawnTimer=0;
    spawnEnemy();

    if(level>=5 && Math.random()<.25)spawnEnemy();
  }

  if(difficultyTimer>600){
    difficultyTimer=0;
    level++;
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    if(p.life<=0)particles.splice(i,1);
  }

  document.getElementById("hp").textContent=player.hp;
  document.getElementById("score").textContent=score;
  document.getElementById("level").textContent=level;
}

function drawGrid(){
  ctx.strokeStyle="#15152c";
  ctx.lineWidth=1;

  const size=50;

  for(let x=0;x<W;x+=size){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=size){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  drawGrid();

  // particles
  for(const p of particles){
    ctx.globalAlpha=p.life/35;
    ctx.fillStyle="#6b5cff";
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // bullets
  for(const b of bullets){
    ctx.shadowBlur=18;
    ctx.shadowColor="#20d9ff";
    ctx.fillStyle="#5ce6ff";
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }

  // enemies
  for(const e of enemies){
    ctx.shadowBlur=25;
    ctx.shadowColor=e.color;
    ctx.fillStyle=e.color;

    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(e.x-4,e.y-3,2,0,Math.PI*2);
    ctx.arc(e.x+4,e.y-3,2,0,Math.PI*2);
    ctx.fill();
  }

  // player
  ctx.save();
  ctx.translate(player.x,player.y);

  const angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  ctx.rotate(angle);

  ctx.shadowBlur=30;
  ctx.shadowColor="#4cc9ff";
  ctx.fillStyle="#168cff";

  ctx.beginPath();
  ctx.moveTo(25,0);
  ctx.lineTo(-15,-13);
  ctx.lineTo(-9,0);
  ctx.lineTo(-15,13);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#a66cff";
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
  ctx.shadowBlur=0;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  reset();
  running=true;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOver").classList.add("hidden");
}

function endGame(){
  running=false;

  const oldBest=Number(localStorage.getItem("gamesaaBest")||0);
  const best=Math.max(oldBest,score);

  localStorage.setItem("gamesaaBest",best);

  document.getElementById("finalScore").textContent=score;
  document.getElementById("bestScore").textContent=best;
  document.getElementById("gameOver").classList.remove("hidden");
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;

document.getElementById("shootBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  mouse.down=true;
});
document.getElementById("shootBtn").addEventListener("touchend",()=>{
  mouse.down=false;
});

loop();
</script>

</body>
</html>
