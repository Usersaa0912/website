<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameSAA CPS Test</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 20%, #21104b, transparent 35%),
    radial-gradient(circle at 20% 80%, #062b45, transparent 35%),
    #05050b;
  color: white;
}

header {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  background: #090914dd;
  border-bottom: 1px solid #30225c;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #a76cff;
  text-shadow: 0 0 15px #713cff;
}

.back {
  color: #aaa;
  text-decoration: none;
}

.back:hover {
  color: #55cfff;
}

.container {
  width: min(950px, 92%);
  margin: 50px auto;
  text-align: center;
}

h1 {
  font-size: clamp(40px, 7vw, 70px);
  color: white;
  text-shadow:
    0 0 10px #8b5cff,
    0 0 30px #5730d9;
}

.subtitle {
  color: #aaaabd;
  margin: 15px 0 35px;
  font-size: 18px;
}

.modes {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.mode {
  border: 1px solid #46327e;
  background: #0d0d1b;
  color: #aaa;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
}

.mode.active,
.mode:hover {
  color: white;
  border-color: #805cff;
  background: #24134d;
  box-shadow: 0 0 15px #4723a0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #0b0b17dd;
  border: 1px solid #302457;
  border-radius: 15px;
  padding: 18px;
}

.stat-title {
  color: #88889d;
  font-size: 14px;
}

.stat-value {
  margin-top: 7px;
  font-size: 30px;
  font-weight: bold;
  color: #62d7ff;
  text-shadow: 0 0 12px #168cff;
}

#clickArea {
  height: 330px;
  border-radius: 25px;
  border: 2px solid #633cff;
  background:
    radial-gradient(circle, #17103a, #090914 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow:
    0 0 25px #311b78,
    inset 0 0 40px #150d36;
  transition: .08s;
  position: relative;
  overflow: hidden;
}

#clickArea:active {
  transform: scale(.985);
  border-color: #5bdcff;
  box-shadow:
    0 0 40px #168cff,
    inset 0 0 50px #102e55;
}

.clickText {
  pointer-events: none;
}

.clickText .icon {
  font-size: 65px;
  margin-bottom: 15px;
}

.clickText h2 {
  font-size: 32px;
}

.clickText p {
  color: #8d8da3;
  margin-top: 10px;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  border: 3px solid #62d7ff;
  pointer-events: none;
  animation: ripple .5s linear forwards;
}

@keyframes ripple {
  from {
    width: 20px;
    height: 20px;
    opacity: 1;
  }
  to {
    width: 180px;
    height: 180px;
    opacity: 0;
  }
}

.result {
  margin-top: 25px;
  color: #9999ad;
}

.result strong {
  color: #a66cff;
}

footer {
  text-align: center;
  padding: 30px;
  color: #66667a;
}

@media(max-width:600px) {
  .stats {
    grid-template-columns: 1fr;
  }

  #clickArea {
    height: 280px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">GameSAA</div>
  <a class="back" href="index.html">← Back</a>
</header>

<div class="container">

  <h1>CPS TEST</h1>

  <p class="subtitle">
    Test how fast you can click!
  </p>

  <div class="modes">
    <button class="mode active" data-time="1">1 Second</button>
    <button class="mode" data-time="5">5 Seconds</button>
    <button class="mode" data-time="10">10 Seconds</button>
    <button class="mode" data-time="30">30 Seconds</button>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">TIME</div>
      <div class="stat-value" id="time">1.00</div>
    </div>

    <div class="stat">
      <div class="stat-title">CLICKS</div>
      <div class="stat-value" id="clicks">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">CPS</div>
      <div class="stat-value" id="cps">0.00</div>
    </div>

  </div>

  <div id="clickArea">

    <div class="clickText">
      <div class="icon">🖱️</div>
      <h2>CLICK HERE</h2>
      <p>Start clicking!</p>
    </div>

  </div>

  <div class="result" id="result">
    Choose a mode and start clicking.
  </div>

</div>

<footer>
  © 2026 GameSAA
</footer>

<script>

let duration = 1;
let clicks = 0;
let startTime = null;
let timer = null;
let running = false;

const clickArea = document.getElementById("clickArea");
const timeDisplay = document.getElementById("time");
const clicksDisplay = document.getElementById("clicks");
const cpsDisplay = document.getElementById("cps");
const result = document.getElementById("result");

const modes = document.querySelectorAll(".mode");

modes.forEach(mode => {

  mode.addEventListener("click", () => {

    modes.forEach(m => m.classList.remove("active"));
    mode.classList.add("active");

    duration = Number(mode.dataset.time);

    reset();

  });

});

function reset() {

  clearInterval(timer);

  clicks = 0;
  startTime = null;
  running = false;

  timeDisplay.textContent = duration.toFixed(2);
  clicksDisplay.textContent = "0";
  cpsDisplay.textContent = "0.00";

  result.innerHTML = "Choose a mode and start clicking.";

}

function startTest() {

  if (running) return;

  running = true;
  clicks = 0;
  startTime = performance.now();

  result.innerHTML = "🔥 Keep clicking!";

  timer = setInterval(updateTimer, 10);

}

function updateTimer() {

  if (!running) return;

  const elapsed = (performance.now() - startTime) / 1000;
  const remaining = Math.max(0, duration - elapsed);

  timeDisplay.textContent = remaining.toFixed(2);

  const currentCps =
    elapsed > 0 ? clicks / elapsed : 0;

  cpsDisplay.textContent = currentCps.toFixed(2);

  if (elapsed >= duration) {
    finishTest();
  }

}

function click() {

  if (!running) {
    startTest();
  }

  if (!running) return;

  clicks++;

  const elapsed =
    (performance.now() - startTime) / 1000;

  const currentCps =
    elapsed > 0 ? clicks / elapsed : 0;

  clicksDisplay.textContent = clicks;
  cpsDisplay.textContent = currentCps.toFixed(2);

  createRipple(event);
}

function finishTest() {

  running = false;

  clearInterval(timer);

  const finalCps = clicks / duration;

  timeDisplay.textContent = "0.00";
  cpsDisplay.textContent = finalCps.toFixed(2);

  const oldBest =
    Number(localStorage.getItem("gamesaaCPS") || 0);

  if (finalCps > oldBest) {

    localStorage.setItem(
      "gamesaaCPS",
      finalCps
    );

    result.innerHTML =
      `🏆 NEW RECORD! <strong>${finalCps.toFixed(2)} CPS</strong>`;

  } else {

    result.innerHTML =
      `🔥 Your result: <strong>${finalCps.toFixed(2)} CPS</strong>`;

  }

}

function createRipple(e) {

  const rect =
    clickArea.getBoundingClientRect();

  const ripple =
    document.createElement("span");

  ripple.className = "ripple";

  ripple.style.left =
    (e.clientX - rect.left - 10) + "px";

  ripple.style.top =
    (e.clientY - rect.top - 10) + "px";

  clickArea.appendChild(ripple);

  setTimeout(() => {
    ripple.remove();
  }, 500);

}

clickArea.addEventListener("click", click);

</script>

</body>
</html>
