<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameSAA | Neon Strike</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#05050b;
    color:white;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 8px #00d9ff;
}

#crosshair::before{
    width:24px;
    height:2px;
    top:11px;
    left:0;
}

#crosshair::after{
    width:2px;
    height:24px;
    left:11px;
    top:0;
}

#topbar{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#a76cff;
    text-shadow:0 0 15px #713cff;
}

.stats{
    display:flex;
    gap:12px;
}

.stat{
    background:#080812dd;
    border:1px solid #34245d;
    border-radius:12px;
    padding:10px 16px;
    min-width:100px;
    text-align:center;
}

.stat span{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:4px;
}

.stat strong{
    font-size:19px;
}

#health{
    color:#45ff8a;
}

#ammo{
    color:#5cdcff;
}

#score{
    color:#c47cff;
}

#wave{
    color:#ffcc5c;
}

#message{
    position:absolute;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 12px black;
}

#damage{
    position:absolute;
    inset:0;
    background:rgba(255,0,40,.35);
    opacity:0;
    transition:opacity .1s;
}

#hitmarker{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:30px;
    opacity:0;
}

#instructions{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:12px;
    background:#080812cc;
    border:1px solid #34245d;
    color:#aaa;
    font-size:13px;
}

#startScreen,
#gameOver{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle,#211044aa,transparent 45%),
        #05050bf2;
}

.panel{
    width:min(520px,90%);
    padding:45px;
    border-radius:25px;
    background:#0b0b17;
    border:1px solid #5637a0;
    box-shadow:0 0 50px #28105c;
}

.panel h1{
    font-size:55px;
    color:#a76cff;
    text-shadow:
        0 0 10px #9b5cff,
        0 0 35px #6b3cff;
    margin-bottom:10px;
}

.panel h2{
    font-size:35px;
    margin-bottom:15px;
}

.panel p{
    color:#9999aa;
    line-height:1.7;
    margin-bottom:25px;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    font-size:16px;
    padding:14px 32px;
    border-radius:25px;
    cursor:pointer;
    background:linear-gradient(90deg,#713cff,#168cff);
    box-shadow:0 0 25px #5030ff;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 40px #704cff;
}

.hidden{
    display:none!important;
}

#gun{
    position:absolute;
    left:50%;
    bottom:-15px;
    width:150px;
    height:210px;
    transform:translateX(-50%);
    pointer-events:none;
}

.gun-body{
    position:absolute;
    right:20px;
    bottom:45px;
    width:100px;
    height:65px;
    background:#171725;
    border:2px solid #4d3c7a;
    transform:skew(-12deg);
}

.gun-barrel{
    position:absolute;
    right:105px;
    bottom:75px;
    width:70px;
    height:22px;
    background:#11111c;
    border:2px solid #4d3c7a;
}

.gun-handle{
    position:absolute;
    right:48px;
    bottom:0;
    width:38px;
    height:75px;
    background:#151522;
    transform:rotate(12deg);
}

.muzzle{
    position:absolute;
    right:170px;
    bottom:75px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#00d9ff;
    box-shadow:0 0 30px #00d9ff;
    opacity:0;
}

@media(max-width:700px){

    .stats{
        gap:4px;
    }

    .stat{
        min-width:70px;
        padding:7px;
    }

    .logo{
        display:none;
    }

    #instructions{
        font-size:11px;
    }

}

</style>

</head>

<body>


<div id="game"></div>


<div id="hud">

    <div id="topbar">

        <div class="logo">
            NEON STRIKE
        </div>

        <div class="stats">

            <div class="stat">
                <span>HEALTH</span>
                <strong id="health">100</strong>
            </div>

            <div class="stat">
                <span>AMMO</span>
                <strong id="ammo">30</strong>
            </div>

            <div class="stat">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>WAVE</span>
                <strong id="wave">1</strong>
            </div>

        </div>

    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="damage"></div>

    <div id="hitmarker">✕</div>

    <div id="instructions">
        WASD = MOVE &nbsp; | &nbsp;
        MOUSE = AIM &nbsp; | &nbsp;
        CLICK = SHOOT
    </div>

    <div id="gun">

        <div class="gun-barrel"></div>
        <div class="gun-body"></div>
        <div class="gun-handle"></div>
        <div class="muzzle"></div>

    </div>

</div>


<!-- START -->

<div id="startScreen">

    <div class="panel">

        <h1>NEON STRIKE</h1>

        <p>
            Enter the arena.<br>
            Destroy the enemies.<br>
            Survive as long as you can.
        </p>

        <button onclick="startGame()">
            PLAY
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="hidden">

    <div class="panel">

        <h2>GAME OVER</h2>

        <p>
            Your score:
            <strong id="finalScore">0</strong>
            <br><br>
            Wave:
            <strong id="finalWave">1</strong>
        </p>

        <button onclick="restartGame()">
            PLAY AGAIN
        </button>

    </div>

</div>


<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =========================
   VARIABLES
========================= */

let scene;
let camera;
let renderer;

let enemies = [];

let bullets = [];

let keys = {};

let running = false;

let health = 100;

let ammo = 30;

let score = 0;

let wave = 1;

let enemiesToSpawn = 5;

let enemiesKilled = 0;

let lastTime = 0;

let shootCooldown = 0;

let enemySpawnTimer = 0;


/* =========================
   HUD
========================= */

const healthText =
document.getElementById("health");

const ammoText =
document.getElementById("ammo");

const scoreText =
document.getElementById("score");

const waveText =
document.getElementById("wave");

const message =
document.getElementById("message");

const damage =
document.getElementById("damage");

const hitmarker =
document.getElementById("hitmarker");

const muzzle =
document.querySelector(".muzzle");


/* =========================
   START
========================= */

window.startGame = function(){

    document
    .getElementById("startScreen")
    .classList.add("hidden");

    running = true;

    resetGame();

    renderer.domElement.requestPointerLock();

};


/* =========================
   RESTART
========================= */

window.restartGame = function(){

    document
    .getElementById("gameOver")
    .classList.add("hidden");

    resetGame();

    running = true;

    renderer.domElement.requestPointerLock();

};


/* =========================
   RESET
========================= */

function resetGame(){

    health = 100;

    ammo = 30;

    score = 0;

    wave = 1;

    enemiesKilled = 0;

    enemiesToSpawn = 5;

    enemySpawnTimer = 0;

    shootCooldown = 0;

    for(const enemy of enemies){

        scene.remove(enemy);

    }

    enemies = [];

    healthText.textContent = health;
    ammoText.textContent = ammo;
    scoreText.textContent = score;
    waveText.textContent = wave;

}


/* =========================
   THREE.JS
========================= */

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x05050b);

    scene.fog =
        new THREE.Fog(
            0x05050b,
            15,
            90
        );


    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            200
        );

    camera.position.set(
        0,
        2,
        10
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.shadowMap.enabled = true;

    document
    .getElementById("game")
    .appendChild(renderer.domElement);


    createWorld();

    window.addEventListener(
        "resize",
        resize
    );

    window.addEventListener(
        "keydown",
        e => keys[e.code] = true
    );

    window.addEventListener(
        "keyup",
        e => keys[e.code] = false
    );

    renderer.domElement.addEventListener(
        "click",
        shoot
    );


    animate();

}


/* =========================
   WORLD
========================= */

function createWorld(){

    /* LIGHT */

    const ambient =
        new THREE.HemisphereLight(
            0x6677ff,
            0x080812,
            1.5
        );

    scene.add(ambient);


    const light =
        new THREE.PointLight(
            0x168cff,
            80,
            60
        );

    light.position.set(
        0,
        8,
        0
    );

    scene.add(light);


    /* FLOOR */

    const floorGeometry =
        new THREE.PlaneGeometry(
            120,
            120
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color:0x090914,
            roughness:.8
        });

    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    /* GRID */

    const grid =
        new THREE.GridHelper(
            120,
            60,
            0x713cff,
            0x15152a
        );

    grid.position.y =
        0.01;

    scene.add(grid);


    /* ARENA WALLS */

    createWall(
        0,5,-50,
        100,10,2
    );

    createWall(
        0,5,50,
        100,10,2
    );

    createWall(
        -50,5,0,
        2,10,100
    );

    createWall(
        50,5,0,
        2,10,100
    );


    /* NEON PILLARS */

    for(let i=0;i<20;i++){

        const x =
            (Math.random()-.5)*80;

        const z =
            (Math.random()-.5)*70;

        createPillar(
            x,
            z
        );

    }

}


/* =========================
   WALL
========================= */

function createWall(
    x,
    y,
    z,
    w,
    h,
    d
){

    const geometry =
        new THREE.BoxGeometry(
            w,h,d
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x11111e
        });

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,y,z
    );

    wall.receiveShadow = true;

    scene.add(wall);

}


/* =========================
   PILLAR
========================= */

function createPillar(x,z){

    const geometry =
        new THREE.BoxGeometry(
            1,
            8,
            1
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x168cff,
            emissive:0x082a66,
            emissiveIntensity:2
        });

    const pillar =
        new THREE.Mesh(
            geometry,
            material
        );

    pillar.position.set(
        x,
        4,
        z
    );

    scene.add(pillar);

}


/* =========================
   ENEMY
========================= */

function spawnEnemy(){

    const group =
        new THREE.Group();


    /* BODY */

    const bodyGeometry =
        new THREE.BoxGeometry(
            1.5,
            2,
            1
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color:0x8d174b,
            emissive:0x36051d,
            emissiveIntensity:1
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.y =
        1.3;

    group.add(body);


    /* HEAD */

    const headGeometry =
        new THREE.BoxGeometry(
            1.1,
            1.1,
            1.1
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color:0x4d164d,
            emissive:0x19061c,
            emissiveIntensity:1
        });

    const head =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    head.position.y =
        2.85;

    group.add(head);


    /* EYES */

    const eyeGeometry =
        new THREE.BoxGeometry(
            .18,
            .18,
            .1
        );

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0xff304f
        });


    const eye1 =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    const eye2 =
        eye1.clone();


    eye1.position.set(
        -.25,
        2.9,
        -.53
    );

    eye2.position.set(
        .25,
        2.9,
        -.53
    );

    group.add(eye1);
    group.add(eye2);


    /* POSITION */

    let x;
    let z;

    do{

        x =
            (Math.random()-.5)*70;

        z =
            (Math.random()-.5)*70;

    }while(
        Math.abs(x)<12 &&
        Math.abs(z)<12
    );


    group.position.set(
        x,
        0,
        z
    );


    group.userData.health = 3;

    group.userData.speed =
        1.3 +
        Math.random()*.8;


    scene.add(group);

    enemies.push(group);

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running)
        return;

    if(document.pointerLockElement !== renderer.domElement)
        return;

    if(shootCooldown > 0)
        return;

    if(ammo <= 0){

        reload();

        return;

    }


    ammo--;

    ammoText.textContent =
        ammo;


    shootCooldown =
        .16;


    muzzle.style.opacity =
        "1";

    setTimeout(()=>{
        muzzle.style.opacity =
            "0";
    },70);


    const raycaster =
        new THREE.Raycaster();


    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const objects=[];

    for(const enemy of enemies){

        enemy.traverse(
            obj => {

                if(obj.isMesh)
                    objects.push(obj);

            }
        );

    }


    const hits =
        raycaster.intersectObjects(
            objects
        );


    if(hits.length){

        const object =
            hits[0].object;

        const enemy =
            object.parent.parent ||
            object.parent;


        if(enemy &&
           enemy.userData.health !== undefined){

            enemy.userData.health--;

            showHitmarker();


            if(enemy.userData.health <= 0){

                killEnemy(enemy);

            }

        }

    }

}


/* =========================
   HIT MARKER
========================= */

function showHitmarker(){

    hitmarker.style.opacity =
        "1";

    setTimeout(()=>{

        hitmarker.style.opacity =
            "0";

    },100);

}


/* =========================
   KILL
========================= */

function killEnemy(enemy){

    scene.remove(enemy);

    enemies =
        enemies.filter(
            e => e !== enemy
        );

    score += 100;

    enemiesKilled++;

    scoreText.textContent =
        score;


    if(
        enemiesKilled >=
        enemiesToSpawn
    ){

        wave++;

        enemiesKilled = 0;

        enemiesToSpawn =
            5 + wave * 2;

        waveText.textContent =
            wave;

        showMessage(
            "WAVE " + wave
        );

    }

}


/* =========================
   RELOAD
========================= */

function reload(){

    ammo = 30;

    ammoText.textContent =
        ammo;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent =
        text;

    setTimeout(()=>{

        message.textContent =
            "";

    },1500);

}


/* =========================
   PLAYER
========================= */

function updatePlayer(delta){

    const speed =
        8 * delta;


    if(keys["KeyW"])
        camera.translateZ(
            -speed
        );

    if(keys["KeyS"])
        camera.translateZ(
            speed
        );

    if(keys["KeyA"])
        camera.translateX(
            -speed
        );

    if(keys["KeyD"])
        camera.translateX(
            speed
        );


    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -47,
            47
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -47,
            47
        );


    camera.position.y = 2;

}


/* =========================
   ENEMIES
========================= */

function updateEnemies(delta){

    for(const enemy of enemies){

        const direction =
            new THREE.Vector3();

        direction.subVectors(
            camera.position,
            enemy.position
        );

        direction.y = 0;

        const distance =
            direction.length();

        direction.normalize();


        enemy.lookAt(
            camera.position.x,
            enemy.position.y,
            camera.position.z
        );


        if(distance > 2.4){

            enemy.position.add(
                direction.multiplyScalar(
                    enemy.userData.speed *
                    delta
                )
            );

        }
        else{

            damagePlayer(
                12 * delta
            );

        }

    }

}


/* =========================
   PLAYER DAMAGE
========================= */

let damageCooldown = 0;

function damagePlayer(amount){

    if(damageCooldown > 0)
        return;

    health -= amount;

    health =
        Math.max(
            0,
            health
        );

    healthText.textContent =
        Math.round(health);

    damage.style.opacity =
        "1";

    setTimeout(()=>{

        damage.style.opacity =
            "0";

    },100);


    damageCooldown =
        .5;


    if(health <= 0){

        endGame();

    }

}


/* =========================
   END GAME
========================= */

function endGame(){

    running = false;

    document.exitPointerLock();

    document
    .getElementById("finalScore")
    .textContent =
        score;

    document
    .getElementById("finalWave")
    .textContent =
        wave;

    document
    .getElementById("gameOver")
    .classList.remove("hidden");

}


/* =========================
   MOUSE LOOK
========================= */

let yaw = 0;
let pitch = 0;

document.addEventListener(
    "mousemove",
    event => {

        if(
            document.pointerLockElement !==
            renderer.domElement
        )
            return;


        yaw -=
            event.movementX * .002;

        pitch -=
            event.movementY * .002;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.4,
                1.4
            );


        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

    }
);


/* =========================
   SPAWN
========================= */

function spawnLogic(delta){

    enemySpawnTimer -= delta;

    if(
        enemySpawnTimer <= 0 &&
        enemies.length <
        enemiesToSpawn
    ){

        spawnEnemy();

        enemySpawnTimer =
            Math.max(
                .4,
                1.5 -
                wave*.06
            );

    }

}


/* =========================
   ANIMATION
========================= */

function animate(time=0){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (time-lastTime)/1000,
            .05
        );

    lastTime =
        time;


    if(running){

        shootCooldown =
            Math.max(
                0,
                shootCooldown-delta
            );

        damageCooldown =
            Math.max(
                0,
                damageCooldown-delta
            );


        updatePlayer(delta);

        updateEnemies(delta);

        spawnLogic(delta);

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   RESIZE
========================= */

function resize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================
   INIT
========================= */

init();

</script>

</body>
</html>
