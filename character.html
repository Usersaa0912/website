<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameSAA | Pixel Character</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at 50% 20%,#32105c,transparent 35%),
    radial-gradient(circle at 20% 80%,#073b5c,transparent 35%),
    #05050b;
}

header{
  height:75px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#090914ee;
  border-bottom:1px solid #30225c;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#a76cff;
  text-shadow:0 0 15px #713cff;
}

.back{
  color:#aaa;
  text-decoration:none;
}

.back:hover{
  color:#5cdcff;
}

.container{
  width:min(1000px,92%);
  margin:40px auto;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h1{
  font-size:clamp(38px,7vw,65px);
  text-shadow:0 0 15px #743cff;
}

.title p{
  color:#aaaabd;
  margin-top:10px;
}

/* LAYOUT */

.creator{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

/* PREVIEW */

.preview{
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;

  border:1px solid #5637a0;
  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      rgba(90,45,170,.15),
      rgba(20,130,200,.08)
    ),
    #080812;

  box-shadow:
    0 0 35px #25145d,
    inset 0 0 50px #120b2c;
}

/* PIXEL CHARACTER */

.pixel-character{
  width:256px;
  height:384px;
  position:relative;

  image-rendering:pixelated;

  filter:
    drop-shadow(0 0 12px #713cff)
    drop-shadow(0 0 30px #168cff);
}

/* each pixel block */

.pixel{
  position:absolute;
  width:16px;
  height:16px;
}

/* HEAD */

.head{
  left:64px;
  top:32px;
  width:128px;
  height:128px;
  background:#c98d65;

  box-shadow:
    inset 0 -16px #b77854;
}

/* HAIR */

.hair{
  left:64px;
  top:16px;
  width:128px;
  height:48px;
  background:#171725;

  clip-path:polygon(
    0 0,100% 0,100% 70%,
    88% 70%,88% 100%,
    75% 100%,75% 65%,
    62% 65%,62% 100%,
    48% 100%,48% 65%,
    35% 65%,35% 100%,
    20% 100%,20% 70%,0 70%
  );
}

/* EYES */

.eye-left{
  left:88px;
  top:96px;
  width:16px;
  height:16px;
  background:#11111a;
}

.eye-right{
  left:152px;
  top:96px;
  width:16px;
  height:16px;
  background:#11111a;
}

/* MOUTH */

.mouth{
  left:112px;
  top:128px;
  width:48px;
  height:8px;
  background:#321522;
}

/* BODY */

.body{
  left:48px;
  top:176px;
  width:160px;
  height:128px;
  background:#171725;

  box-shadow:
    inset 0 -16px rgba(0,0,0,.2);
}

/* ARMS */

.arm-left{
  left:16px;
  top:192px;
  width:32px;
  height:112px;
  background:#151522;
}

.arm-right{
  left:208px;
  top:192px;
  width:32px;
  height:112px;
  background:#151522;
}

/* HANDS */

.hand-left{
  left:16px;
  top:304px;
  width:32px;
  height:32px;
  background:#c98d65;
}

.hand-right{
  left:208px;
  top:304px;
  width:32px;
  height:32px;
  background:#c98d65;
}

/* LEGS */

.leg-left{
  left:64px;
  top:304px;
  width:48px;
  height:64px;
  background:#11111e;
}

.leg-right{
  left:144px;
  top:304px;
  width:48px;
  height:64px;
  background:#11111e;
}

/* SHOES */

.shoe-left{
  left:48px;
  top:368px;
  width:64px;
  height:16px;
  background:#080812;
}

.shoe-right{
  left:144px;
  top:368px;
  width:64px;
  height:16px;
  background:#080812;
}

/* ACCESSORY */

.accessory{
  position:absolute;
  left:64px;
  top:0;

  width:128px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  image-rendering:pixelated;
}

/* CONTROLS */

.controls{
  padding:30px;

  border-radius:25px;

  background:#0b0b17dd;

  border:1px solid #302457;

  box-shadow:0 0 30px #1b103e;
}

.control{
  margin-bottom:22px;
}

.control label{
  display:block;
  color:#aaa;
  margin-bottom:10px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.option{
  padding:10px 14px;

  border-radius:10px;

  border:1px solid #3a2c62;

  background:#111120;

  color:#bbb;

  cursor:pointer;
}

.option:hover,
.option.active{
  color:white;

  border-color:#744cff;

  background:#25144d;

  box-shadow:0 0 12px #4320a0;
}

.save{
  width:100%;

  border:0;

  padding:15px;

  border-radius:30px;

  color:white;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  background:
    linear-gradient(
      90deg,
      #713cff,
      #168cff
    );

  box-shadow:0 0 25px #5030ff;
}

.saved{
  text-align:center;
  color:#5cdcff;
  margin-top:15px;
  display:none;
}

@media(max-width:800px){

  .creator{
    grid-template-columns:1fr;
  }

  .preview{
    min-height:480px;
  }

}
</style>
</head>

<body>

<header>

<div class="logo">
GameSAA
</div>

<a href="index.html" class="back">
← Back
</a>

</header>

<div class="container">

<div class="title">

<h1>PIXEL CHARACTER</h1>

<p>
Create your own GameSAA pixel character 🎮
</p>

</div>


<div class="creator">


<!-- PIXEL PREVIEW -->

<div class="preview">

<div class="pixel-character">

<div class="head" id="head"></div>

<div class="hair" id="hair"></div>

<div class="pixel eye-left"></div>

<div class="pixel eye-right"></div>

<div class="pixel mouth"></div>

<div class="body" id="body"></div>

<div class="pixel arm-left"></div>

<div class="pixel arm-right"></div>

<div class="pixel hand-left"></div>

<div class="pixel hand-right"></div>

<div class="pixel leg-left"></div>

<div class="pixel leg-right"></div>

<div class="pixel shoe-left"></div>

<div class="pixel shoe-right"></div>

<div class="accessory" id="accessory"></div>

</div>

</div>


<!-- CONTROLS -->

<div class="controls">


<div class="control">

<label>Skin</label>

<div class="options">

<button class="option active"
data-type="skin"
data-value="#c98d65">
Light
</button>

<button class="option"
data-type="skin"
data-value="#8d5b3d">
Dark
</button>

<button class="option"
data-type="skin"
data-value="#f0b98b">
Tan
</button>

</div>

</div>


<div class="control">

<label>Hair</label>

<div class="options">

<button class="option active"
data-type="hair"
data-value="black">
Black
</button>

<button class="option"
data-type="hair"
data-value="blue">
Blue
</button>

<button class="option"
data-type="hair"
data-value="purple">
Purple
</button>

<button class="option"
data-type="hair"
data-value="white">
White
</button>

</div>

</div>


<div class="control">

<label>Outfit</label>

<div class="options">

<button class="option active"
data-type="outfit"
data-value="dark">
Dark
</button>

<button class="option"
data-type="outfit"
data-value="blue">
Blue
</button>

<button class="option"
data-type="outfit"
data-value="purple">
Purple
</button>

<button class="option"
data-type="outfit"
data-value="neon">
Neon
</button>

</div>

</div>


<div class="control">

<label>Accessory</label>

<div class="options">

<button class="option active"
data-type="accessory"
data-value="">
None
</button>

<button class="option"
data-type="accessory"
data-value="🎧">
Headphones
</button>

<button class="option"
data-type="accessory"
data-value="🕶️">
Glasses
</button>

<button class="option"
data-type="accessory"
data-value="👑">
Crown
</button>

</div>

</div>


<button class="save" id="save">

💾 SAVE CHARACTER

</button>

<div class="saved" id="saved">

✓ Character saved!

</div>

</div>

</div>

</div>


<script>

const settings={

skin:"#c98d65",

hair:"black",

outfit:"dark",

accessory:""

};

const head=
document.getElementById("head");

const hair=
document.getElementById("hair");

const body=
document.getElementById("body");

const accessory=
document.getElementById("accessory");


function update(){

head.style.background=
settings.skin;

hair.style.background=
getHairColor(settings.hair);

body.style.background=
getOutfitColor(settings.outfit);

accessory.textContent=
settings.accessory;

}


function getHairColor(type){

if(type==="blue")
return "#168cff";

if(type==="purple")
return "#743cff";

if(type==="white")
return "#e8eaff";

return "#171725";

}


function getOutfitColor(type){

if(type==="blue")
return "#145da8";

if(type==="purple")
return "#5425a8";

if(type==="neon")
return "#713cff";

return "#171725";

}


document
.querySelectorAll(".option")
.forEach(button=>{

button.addEventListener("click",()=>{

const type=
button.dataset.type;

const value=
button.dataset.value;

document
.querySelectorAll(
`.option[data-type="${type}"]`
)
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

settings[type]=value;

update();

});

});


document
.getElementById("save")
.addEventListener("click",()=>{

localStorage.setItem(
"gamesaaCharacter",
JSON.stringify(settings)
);

document
.getElementById("saved")
.style.display="block";

setTimeout(()=>{

document
.getElementById("saved")
.style.display="none";

},2500);

});


const saved=
localStorage.getItem(
"gamesaaCharacter"
);

if(saved){

Object.assign(
settings,
JSON.parse(saved)
);

update();

}

</script>

</body>
</html>
